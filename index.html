<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Knitworks CRM</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("kw2:theme") || "dark"; if (localStorage.getItem("kw2:pinned") === "true") document.documentElement.classList.add("pin-early"); } catch (e) {}</script>
  <link rel="stylesheet" href="app.css?v=6ae541c147">
</head>
<body>
  <div class="bg"></div>

  <!-- Left: the whole navigation. Narrow when idle, slides open on hover (or when pinned) and pushes the page right. -->
  <aside class="side" id="side" aria-label="Pages">
    <div class="side-brand">
      <div class="logo">K</div>
      <div class="side-txt"><b>Knitworks CRM</b><small id="farm-name"></small></div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <button class="side-pin" id="pin" aria-label="Pin menu"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v7"/></svg></span><span class="nl"></span></button>
  </aside>

  <!-- Top: option buttons only. Admin can hide each one. -->
  <header class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="top-actions">
      <button class="tb-search" data-tb="search" data-act="search" title="Search (Ctrl+K)"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
      <button class="icon-btn primary" data-tb="new" data-act="new" title="New"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" data-tb="today" data-go="today" title="Today"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg></button>
      <button class="icon-btn" data-tb="email" data-go="email" title="Email"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></button>
      <button class="icon-btn" data-tb="booklink" data-act="booklink" title="Copy the Book a call link"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
      <button class="icon-btn bell" data-tb="bell" id="bell" title="Notifications" aria-label="Notifications"></button>
      <select class="mini" data-tb="lang" id="lang" aria-label="Language"></select>
      <button class="icon-btn" data-tb="theme" id="theme" title="Light or dark"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="avatar" id="me" tabindex="0" role="button" aria-label="Account"></div>
    </div>
  </header>

  <main id="view"><div class="page"><p class="muted">Loading…</p></div></main>
  <div id="layer"></div>
  <div id="toast" role="status"></div>

  <script src="demo.js?v=2798cf47a9"></script>
  <script src="app.js?v=c5368ae04b"></script>
</body>
</html>
