<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Book a call</title>
  <style>
    :root { --bg1:#071a2c; --bg2:#0b2e45; --bg3:#0d3b3a; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --text:#e8f1f8; --muted:#9db3c6; --blue:#4c9bff; --green:#3fcf8e; --red:#ff6b6b; color-scheme:dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; color:var(--text);
      font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background: radial-gradient(900px 500px at 15% -10%, rgba(76,155,255,.28), transparent 60%),
                  radial-gradient(800px 500px at 95% 10%, rgba(63,207,142,.18), transparent 60%),
                  linear-gradient(160deg, var(--bg2), var(--bg1) 45%, var(--bg3)); }
    .box { width:100%; max-width:480px; background:var(--glass); border:1px solid var(--line); border-radius:22px; padding:28px; backdrop-filter:blur(16px); animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
    h1 { margin:0 0 4px; font-size:26px; } p { margin:0 0 16px; color:var(--muted); }
    form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:5px; font-size:13px; color:var(--muted); } label.full { grid-column:1/-1; }
    input, textarea { font:inherit; color:var(--text); background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    textarea { min-height:90px; resize:vertical; }
    .hp { position:absolute; left:-9999px; }
    button { grid-column:1/-1; font:inherit; font-weight:600; border:0; border-radius:12px; padding:11px; background:var(--blue); color:#fff; cursor:pointer; }
    .msg { grid-column:1/-1; min-height:1.2em; font-size:14px; }
    .msg.bad { color:var(--red); } .msg.ok { color:var(--green); }
    @media (max-width:520px) { form { grid-template-columns:1fr; } }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <div class="box">
    <h1>Book a call</h1>
    <p>Tell us who you are and what it is about. We will confirm the time.</p>
    <form id="f">
      <label>Your name <input name="name" required maxlength="120"></label>
      <label>Farm or company <input name="org" maxlength="120"></label>
      <label>Email <input name="email" type="email" maxlength="120"></label>
      <label>Phone <input name="phone" maxlength="40"></label>
      <label class="full">Preferred time <input name="when" type="datetime-local"></label>
      <label class="full">What is it about? <textarea name="topic" required maxlength="300"></textarea></label>
      <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
      <div class="msg" id="msg" role="status"></div>
      <button>Send request</button>
    </form>
  </div>
  <script src="demo.js?v=1119f28680"></script>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg"), data = Object.fromEntries(new FormData(e.target));
      msg.className = "msg"; msg.textContent = "";
      if (!data.email && !data.phone) { msg.className = "msg bad"; msg.textContent = "Please give an email or a phone number."; return; }
      try {
        const r = await fetch("/api/public/book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        const j = await r.json();
        if (r.ok) { e.target.reset(); msg.className = "msg ok"; msg.textContent = "Thank you. We received your request and will get back to you."; }
        else { msg.className = "msg bad"; msg.textContent = j.error || "Something went wrong."; }
      } catch (x) { msg.className = "msg bad"; msg.textContent = "No connection. Please try again."; }
    });
  </script>
</body>
</html>
